# See:
# https://docs.github.com/en/free-pro-team@latest/actions/guides/publishing-java-packages-with-maven
# https://central.sonatype.org/pages/apache-maven.html
# https://github.com/actions/setup-java

name: release

on:
  workflow_dispatch:

jobs:
  release:
    environment: maven_central
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Maven Central repository
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          # See https://central.sonatype.org/publish/publish-portal-maven/
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Set up Git user
        run: |
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Release
        run: |
          ./mvnw -B -Dusername=${{ secrets.GH_USERNAME }} -Dpassword=${{ secrets.GH_ACCESS_TOKEN }} release:prepare
          ./mvnw -B release:perform
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
